apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-analysis
  namespace: argocd # the Application object lives with Argo; its destination is conduit
spec:
  project: platform-foundry
  source:
    repoURL: https://github.com/aryn-lacy/platform-foundry.git
    targetRevision: main
    path: k8s/analysis/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: conduit # AnalysisTemplates are namespace-scoped: land where the Rollouts live
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
