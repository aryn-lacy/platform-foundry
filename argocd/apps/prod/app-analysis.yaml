apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-analysis
  namespace: argocd # the Application object lives with Argo; its destination is conduit
spec:
  project: platform-foundry
  source:
    repoURL: https://github.com/aryn-lacy/platform-foundry.git
    targetRevision: main
    path: k8s/analysis/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: conduit # AnalysisTemplates are namespace-scoped: land where the Rollouts live
  syncPolicy:
    # prod: gated like its siblings — no automated sync; the promotion PR
    # merge is the trigger, sync approved by a human or the
    # tag-promotion workflow. selfHeal here would let unreviewed
    # successCondition/failureLimit changes reach prod automatically.
    syncOptions:
      - CreateNamespace=false
