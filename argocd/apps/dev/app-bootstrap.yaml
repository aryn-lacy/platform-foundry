apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-bootstrap
  namespace: argocd
spec:
  project: platform-foundry
  source:
    repoURL: https://github.com/aryn-lacy/platform-foundry.git
    targetRevision: main
    path: k8s/bootstrap/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: foundry-bootstrap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
