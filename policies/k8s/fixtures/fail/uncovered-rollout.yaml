# FAIL fixture: coverage violation — a Rollout no NetworkPolicy selects
# (the NP below selects a different label). Proves the coverage branch.
apiVersion: apps/v1
kind: Rollout
metadata:
  name: orphan-app
  namespace: conduit
spec:
  template:
    metadata:
      labels:
        app: orphan-app
    spec:
      containers:
        - name: app
          image: registry.example.com/orphan:v1.0.0
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: selects-something-else
  namespace: conduit
spec:
  podSelector:
    matchLabels:
      app: other-app
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
