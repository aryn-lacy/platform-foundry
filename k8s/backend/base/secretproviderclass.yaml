# SecretProviderClass (ADR-002): provider-level fetch — the mounting SA's
# Pod Identity association (conduit/backend in infra/eks.tf) is what ASCP
# borrows. usePodIdentity: true is required; syncTarget creates a native
# Secret for envFrom consumption while the mount is the source of truth.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-db
  namespace: conduit
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "platform-foundry/PLACEHOLDER_ENV/app-db"
        type: secretsmanager
        jmesPath:
          - path: username
            objectAlias: dbuser
          - path: password
            objectAlias: dbpassword
          - path: host
            objectAlias: dbhost
          - path: port
            objectAlias: dbport
          - path: dbname
            objectAlias: dbname
  secretObjects:
    - secretName: backend-db
      type: Opaque
      data:
        - key: SPRING_DATASOURCE_USERNAME
          objectRef: dbuser
        - key: SPRING_DATASOURCE_PASSWORD
          objectRef: dbpassword
        - key: SPRING_DATASOURCE_HOST
          objectRef: dbhost
        - key: SPRING_DATASOURCE_PORT
          objectRef: dbport
        - key: SPRING_DATASOURCE_DATABASE
          objectRef: dbname

