# Read-only visibility on its own Job object (status polling); no restart verb — re-runs are a new Job from git.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-bootstrap
  namespace: foundry-bootstrap
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-bootstrap
  namespace: foundry-bootstrap
subjects:
  - kind: ServiceAccount
    name: db-bootstrap
    namespace: foundry-bootstrap
roleRef:
  kind: Role
  name: db-bootstrap
  apiGroup: rbac.authorization.k8s.io
