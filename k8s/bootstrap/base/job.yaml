# Roles-only bootstrap Job (ADR-008 contract): connects to each RDS tier
# as master using CSI-mounted break-glass secrets and creates the
# least-privilege service roles with their ALREADY-STAGED passwords.
# Each instance provisions its own database at creation — no database
# creation here. Idempotent (IF NOT EXISTS).
#
# Shell-safety: NO $${VAR} double-dollar syntax anywhere in this file —
# in YAML block scalars $$ reaches bash literally and expands to the
# PID. Plain $VAR reads from files are exported once, then passed to
# psql via -v (server-side substitution).
apiVersion: batch/v1
kind: Job
metadata:
  name: db-roles
  namespace: foundry-bootstrap
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: db-bootstrap
    spec:
      serviceAccountName: db-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD
              # --- app tier ---
              PGPASSWORD=$(cat /mnt/secrets/masterapppassword)
              APP_PASS=$(cat /mnt/secrets/apppassword)
              APP_HOST=$(cat /mnt/secrets/apphost)
              psql "host=$APP_HOST user=foundry_admin dbname=realworld_app sslmode=require" \
                -v appass="$APP_PASS" <<'SQL'
              DO $do$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'realworld_app') THEN
                  CREATE ROLE realworld_app LOGIN PASSWORD :'appass';
                END IF;
              END
              $do$;
              GRANT ALL PRIVILEGES ON DATABASE realworld_app TO realworld_app;
              SQL
              # --- keycloak tier ---
              PGPASSWORD=$(cat /mnt/secrets/masterkcpassword)
              KC_PASS=$(cat /mnt/secrets/kcpassword)
              KC_HOST=$(cat /mnt/secrets/kchost)
              psql "host=$KC_HOST user=foundry_admin dbname=keycloak sslmode=require" \
                -v kcpass="$KC_PASS" <<'SQL'
              DO $do$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'keycloak') THEN
                  CREATE ROLE keycloak LOGIN PASSWORD :'kcpass';
                END IF;
              END
              $do$;
              GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak;
              SQL
              echo "roles provisioned"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {} # writable /tmp: busybox ash materializes heredocs here
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: db-bootstrap
