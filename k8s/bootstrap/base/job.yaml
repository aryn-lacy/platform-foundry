# Roles-only bootstrap Job (ADR-008 contract): connects to each RDS tier
# as master using CSI-mounted break-glass secrets and creates the
# least-privilege service roles with their ALREADY-STAGED passwords.
# Each instance provisions its own database at creation — no database
# creation here. Idempotent (IF NOT EXISTS).
#
# Shell-safety: NO $${VAR} double-dollar syntax anywhere in this file —
# in YAML block scalars $$ reaches bash literally and expands to the
# PID. Secret handling:
#   - PGPASSWORD is exported (libpq reads the environment; the value
#     never appears on any argv / /proc/<pid>/cmdline).
#   - Role passwords are SQL-escaped ('' doubling) before interpolating
#     into 0600 heredoc SQL files; psql consumes them with -f.
#   - SQL files are removed via an EXIT trap — on success AND failure.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-roles
  namespace: foundry-bootstrap
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: db-bootstrap
    spec:
      serviceAccountName: db-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              umask 077
              trap 'rm -f /tmp/app-role.sql /tmp/kc-role.sql' EXIT
              # Plain $VAR here is shell runtime expansion — the $$ trap is
              # YAML-block-scalar-specific and absent by construction.

              # --- app tier ---
              export PGPASSWORD=$(cat /mnt/secrets/masterapppassword)
              APP_PASS=$(cat /mnt/secrets/apppassword)
              APP_HOST=$(cat /mnt/secrets/apphost)
              APP_PASS_SQL=$(printf '%s' "$APP_PASS" | sed "s/'/''/g")
              cat > /tmp/app-role.sql <<EOF
              DO \$do\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'realworld_app') THEN
                  CREATE ROLE realworld_app LOGIN PASSWORD '$APP_PASS_SQL';
                END IF;
              END
              \$do\$;
              GRANT ALL PRIVILEGES ON DATABASE realworld_app TO realworld_app;
              EOF
              psql "host=$APP_HOST user=foundry_admin dbname=realworld_app sslmode=require" -f /tmp/app-role.sql

              # --- keycloak tier ---
              export PGPASSWORD=$(cat /mnt/secrets/masterkcpassword)
              KC_PASS=$(cat /mnt/secrets/kcpassword)
              KC_HOST=$(cat /mnt/secrets/kchost)
              KC_PASS_SQL=$(printf '%s' "$KC_PASS" | sed "s/'/''/g")
              cat > /tmp/kc-role.sql <<EOF
              DO \$do\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'keycloak') THEN
                  CREATE ROLE keycloak LOGIN PASSWORD '$KC_PASS_SQL';
                END IF;
              END
              \$do\$;
              GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak;
              EOF
              psql "host=$KC_HOST user=foundry_admin dbname=keycloak sslmode=require" -f /tmp/kc-role.sql

              echo "roles provisioned"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {} # writable /tmp: busybox ash materializes heredocs here
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: db-bootstrap
