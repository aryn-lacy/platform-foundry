# The bootstrap job reads: both break-glass master secrets + both service
# credential secrets (it needs the staged passwords to CREATE ROLE with).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-bootstrap
  namespace: foundry-bootstrap
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "platform-foundry/PLACEHOLDER_ENV/db-master-app"
        type: secretsmanager
        jmesPath:
          - path: username
            objectAlias: masterappuser
          - path: password
            objectAlias: masterapppassword
          - path: host
            objectAlias: masterapphost
      - objectName: "platform-foundry/PLACEHOLDER_ENV/app-db"
        type: secretsmanager
        jmesPath:
          - path: username
            objectAlias: appuser
          - path: password
            objectAlias: apppassword
          - path: host
            objectAlias: apphost
      - objectName: "platform-foundry/PLACEHOLDER_ENV/db-master-keycloak"
        type: secretsmanager
        jmesPath:
          - path: username
            objectAlias: masterkcuser
          - path: password
            objectAlias: masterkcpassword
          - path: host
            objectAlias: masterkchost
      - objectName: "platform-foundry/PLACEHOLDER_ENV/keycloak-db"
        type: secretsmanager
        jmesPath:
          - path: username
            objectAlias: kcuser
          - path: password
            objectAlias: kcpassword
          - path: host
            objectAlias: kchost
  volumeMount:
    - name: secrets
      mountPath: /mnt/secrets
      readOnly: true
