# The bootstrap job reads: both break-glass master secrets (password +
# host) and both service credential secrets (password + host — the staged
# passwords it creates roles with). Username is foundry_admin (matches
# modules/database master user); service usernames are irrelevant here.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-bootstrap
  namespace: foundry-bootstrap
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "platform-foundry/PLACEHOLDER_ENV/db-master-app"
        type: secretsmanager
        jmesPath:
          - path: password
            objectAlias: masterapppassword
          - path: host
            objectAlias: apphost
      - objectName: "platform-foundry/PLACEHOLDER_ENV/app-db"
        type: secretsmanager
        jmesPath:
          - path: password
            objectAlias: apppassword
      - objectName: "platform-foundry/PLACEHOLDER_ENV/db-master-keycloak"
        type: secretsmanager
        jmesPath:
          - path: password
            objectAlias: masterkcpassword
          - path: host
            objectAlias: kchost
      - objectName: "platform-foundry/PLACEHOLDER_ENV/keycloak-db"
        type: secretsmanager
        jmesPath:
          - path: password
            objectAlias: kcpassword
