# Env-specific break-glass + credential paths (dev landing zone)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-bootstrap
spec:
  parameters:
    objects: |
      - objectName: "platform-foundry/dev/db-master-app"
        type: secretsmanager
        jmesPath:
          - path: password
            objectAlias: masterapppassword
          - path: host
            objectAlias: masterapphost
      - objectName: "platform-foundry/dev/app-db"
        type: secretsmanager
        jmesPath:
          - path: password
            objectAlias: apppassword
          - path: host
            objectAlias: apphost
      - objectName: "platform-foundry/dev/db-master-keycloak"
        type: secretsmanager
        jmesPath:
          - path: password
            objectAlias: masterkcpassword
          - path: host
            objectAlias: masterkchost
      - objectName: "platform-foundry/dev/keycloak-db"
        type: secretsmanager
        jmesPath:
          - path: password
            objectAlias: kcpassword
          - path: host
            objectAlias: kchost
