# SecretProviderClass (ADR-002): provider-level fetch — the mounting SA's
# Pod Identity association (keycloak/keycloak in infra/eks.tf) is what
# ASCP borrows. The CSI volume in deployment.yaml is REQUIRED: secretObjects
# sync only when a pod mounts the volume.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: keycloak
  namespace: keycloak
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "platform-foundry/PLACEHOLDER_ENV/keycloak-db"
        type: secretsmanager
        jmesPath:
          - path: username
            objectAlias: dbuser
          - path: password
            objectAlias: dbpassword
          - path: host
            objectAlias: dbhost
          - path: dbname
            objectAlias: dbname
      - objectName: "platform-foundry/PLACEHOLDER_ENV/keycloak-admin"
        type: secretsmanager
        jmesPath:
          - path: username
            objectAlias: adminuser
          - path: password
            objectAlias: adminpassword
      # keycloak-client added per-overlay (env secret path); its clientsecret
      # alias is read from the CSI mount by the entrypoint (realm import).
  secretObjects:
    - secretName: keycloak-db
      type: Opaque
      data:
        - key: username
          objectRef: dbuser
        - key: password
          objectRef: dbpassword
        - key: host
          objectRef: dbhost
        - key: dbname
          objectRef: dbname
    - secretName: keycloak-admin
      type: Opaque
      data:
        - key: username
          objectRef: adminuser
        - key: password
          objectRef: adminpassword
