# AnalysisTemplates (ADR-005): the canary's metric guard. Queries the
# ASSUMED platform Prometheus (docs/assumptions.md A3) — the address is
# an overlay parameter (per-env), declared not hidden.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-error-rate
spec:
  args:
    - name: service-name
    - name: prometheus-address
      value: http://prometheus.platform.svc:9090
  metrics:
    - name: error-rate
      interval: 2m
      count: 3
      successCondition: len(result) == 0 || result[0] < 0.05
      failureLimit: 2
      provider:
        prometheus:
          address: "{{args.prometheus-address}}"
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",code=~"5.."}[2m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))
---
