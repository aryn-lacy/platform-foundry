# Policy gate: terraform + IaC scans + rendered-manifest policies.
# Runs wherever infra, k8s, argocd, or the policies themselves change.
# Holds NO cloud credentials: tofu validate only (no plan/apply), scans
# run against the repository tree.
name: policy

on:
  pull_request:
    paths:
      - "infra/**"
      - "k8s/**"
      - "argocd/**"
      - "policies/**"
      - ".github/workflows/policy.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "k8s/**"
      - "argocd/**"
      - "policies/**"
      - ".github/workflows/policy.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - name: fmt + validate
        working-directory: infra
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false
          tofu validate

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tfsec (fail on HIGH+)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra
          minimum_severity: HIGH
      - name: checkov (fail on any finding)
        uses: bridgecrewio/checkov-action@v12.3122.0
        with:
          directory: infra
          framework: terraform
          skip_download: true
          quiet: true

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.4.3
      - name: Install conftest
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.69.0/conftest_0.69.0_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin conftest
          conftest --version
      - name: Render + policy-check all 12 targets
        run: make policy KUSTOMIZE=kustomize CONFTEST=conftest
      - name: Rule fixtures (fail-fixtures must fail)
        run: make policy-test CONFTEST=conftest
