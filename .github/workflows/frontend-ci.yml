# Frontend CI: build (API_URL build-arg) -> trivy -> gated ECR push ->
# set-image commit. Same portfolio posture as backend-ci.
name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "k8s/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "k8s/frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: write # set-image commit (main-only job)

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: apps/frontend/yarn.lock
      - name: "Lint + unit tests"
        working-directory: apps/frontend
        run: |
          yarn install --frozen-lockfile
          yarn test
          yarn eslint --fix=false

  build-scan:
    runs-on: ubuntu-latest
    needs: lint-unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (layer cache, no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: false
          load: true
          tags: platform-foundry/frontend:ci
          build-args: |
            API_URL=${{ vars.API_URL || 'https://api.platform-foundry.example' }}
            VERSION=ci-${{ github.sha }}
            BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: platform-foundry/frontend:ci
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  push-and-set-image:
    # Push + deploy-record commit — main pushes only; individual steps
    # gate on registry credentials (checked in the first step, since the
    # secrets context is not available in job-level `if`).
    runs-on: ubuntu-latest
    needs: build-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check registry credentials
        id: aws
        run: |
          if [ -n "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            echo "has_aws=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_aws=false" >> "$GITHUB_OUTPUT"
            echo "### ECR push skipped — no registry credentials (portfolio posture)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.aws.outputs.has_aws == 'true'
      - name: Configure AWS credentials
        if: steps.aws.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Login to ECR
        if: steps.aws.outputs.has_aws == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
        if: steps.aws.outputs.has_aws == 'true'
      - name: Build + push sha tag
        if: steps.aws.outputs.has_aws == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: true
          build-args: |
            API_URL=${{ vars.API_URL || 'https://api.platform-foundry.example' }}
          tags: ${{ vars.ECR_REGISTRY || format('{0}.dkr.ecr.{1}.amazonaws.com', secrets.AWS_ACCOUNT_ID, vars.AWS_REGION || 'us-east-1') }}/${{ vars.ECR_REPO_PREFIX || 'platform-foundry' }}/frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: kustomize edit set image (dev overlay)
        if: steps.aws.outputs.has_aws == 'true'
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin
          cd k8s/frontend/overlays/dev
          kustomize edit set image frontend=${{ vars.ECR_REGISTRY || format('{0}.dkr.ecr.{1}.amazonaws.com', secrets.AWS_ACCOUNT_ID, vars.AWS_REGION || 'us-east-1') }}/${{ vars.ECR_REPO_PREFIX || 'platform-foundry' }}/frontend:sha-${{ github.sha }}
      - name: Commit deploy record [skip ci]
        if: steps.aws.outputs.has_aws == 'true'
        run: |
          git config user.name "platform-foundry-ci"
          git config user.email "ci@platform-foundry.local"
          git add k8s/frontend/overlays/dev
          git commit -m "deploy(frontend): sha-${{ github.sha }} to dev [skip ci]"
          git push
