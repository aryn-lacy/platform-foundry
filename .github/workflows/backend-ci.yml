# Backend CI: lint+unit -> integration (Testcontainers: keycloak+postgres)
# -> docker build (layer-cached) -> trivy (fail CRITICAL) -> ECR push ->
# set-image commit to the dev overlay (the deploy record Argo pulls).
#
# Cost-free portfolio posture: ECR push + set-image run ONLY when
# AWS_ACCOUNT_ID is configured as a repo secret; otherwise they skip with
# an explicit message. No cloud credentials are otherwise used.
name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "k8s/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "k8s/backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: write # set-image commit (main-only job)

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: "Unit tests"
        working-directory: apps/backend
        # Exclude the Spring context-load test (needs live Postgres +
        # Keycloak); integration covers it with Testcontainers below.
        run: ./mvnw -B test -Dtest='!RealworldApplicationTests,!PlatformIntegrationTests' -Dsurefire.failIfNoSpecifiedTests=false

  integration:
    runs-on: ubuntu-latest
    needs: lint-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: "Integration tests (Testcontainers: keycloak + postgres)"
        working-directory: apps/backend
        # Only our PlatformIntegrationTests (real containers); upstream's
        # context test is excluded from the plain unit stage above.
        run: ./mvnw -B test -Dtest='PlatformIntegrationTests'

  build-scan:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (layer cache, no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: false
          load: true
          tags: platform-foundry/backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: platform-foundry/backend:ci
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  push-and-set-image:
    # Push + deploy-record commit — main pushes only; individual steps
    # gate on registry credentials (checked in the first step, since the
    # secrets context is not available in job-level `if`).
    runs-on: ubuntu-latest
    needs: build-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check registry credentials
        id: aws
        run: |
          if [ -n "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            echo "has_aws=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_aws=false" >> "$GITHUB_OUTPUT"
            echo "### ECR push skipped — no registry credentials (portfolio posture)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.aws.outputs.has_aws == 'true'
      - name: Configure AWS credentials
        if: steps.aws.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Login to ECR
        if: steps.aws.outputs.has_aws == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
        if: steps.aws.outputs.has_aws == 'true'
      - name: Build + push sha tag
        if: steps.aws.outputs.has_aws == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: ${{ vars.ECR_REGISTRY || format('{0}.dkr.ecr.{1}.amazonaws.com', secrets.AWS_ACCOUNT_ID, vars.AWS_REGION || 'us-east-1') }}/${{ vars.ECR_REPO_PREFIX || 'platform-foundry' }}/backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: kustomize edit set image (dev overlay)
        if: steps.aws.outputs.has_aws == 'true'
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin
          cd k8s/backend/overlays/dev
          kustomize edit set image backend=${{ vars.ECR_REGISTRY || format('{0}.dkr.ecr.{1}.amazonaws.com', secrets.AWS_ACCOUNT_ID, vars.AWS_REGION || 'us-east-1') }}/${{ vars.ECR_REPO_PREFIX || 'platform-foundry' }}/backend:sha-${{ github.sha }}
      - name: Commit deploy record [skip ci]
        if: steps.aws.outputs.has_aws == 'true'
        run: |
          git config user.name "platform-foundry-ci"
          git config user.email "ci@platform-foundry.local"
          git add k8s/backend/overlays/dev
          git commit -m "deploy(backend): sha-${{ github.sha }} to dev [skip ci]"
          git push
